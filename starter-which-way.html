<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starter: which way does it travel?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F8; --panel:#FFFFFF; --ink:#14213D; --muted:#55627A; --line:#D5DDE6;
  --navy:#1B2A4A; --teal:#0F8B8D; --orange:#E8791F; --bad:#C4342D; --good:#1E7F48;
  --soft:#E9EEF3; --onaccent:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1726; --panel:#17223A; --ink:#E8EDF5; --muted:#9AA8BF; --line:#2B3A56;
    --navy:#8FB0E8; --teal:#3CC4C2; --orange:#F5A04D; --bad:#F07167; --good:#5BD08D;
    --soft:#1E2B46; --onaccent:#0F1726;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1726; --panel:#17223A; --ink:#E8EDF5; --muted:#9AA8BF; --line:#2B3A56;
  --navy:#8FB0E8; --teal:#3CC4C2; --orange:#F5A04D; --bad:#F07167; --good:#5BD08D;
  --soft:#1E2B46; --onaccent:#0F1726;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:26px 18px 48px}
h1{font-size:2.1rem;line-height:1.15;margin:0}
.sub{color:var(--muted);margin:6px 0 20px;max-width:64ch}
.parts{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.pill{padding:4px 12px;border-radius:999px;border:2px solid var(--line);font-size:.9rem;color:var(--muted)}
.pill.on{border-color:var(--teal);color:var(--ink);font-weight:700}
.pill.done{border-color:var(--good);color:var(--good)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.tray{display:flex;flex-wrap:wrap;gap:10px;min-height:58px}
.tray:empty::after{content:"All placed. Check your sort below.";color:var(--muted);align-self:center}
.chip{
  font:700 1rem "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink);background:var(--panel);
  border:2px solid var(--line);border-radius:10px;padding:10px 14px;cursor:grab;
  display:flex;align-items:center;gap:8px;touch-action:manipulation;text-align:left
}
.chip .em{font-size:1.3rem;line-height:1}
.chip[aria-pressed="true"]{border-color:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 30%,transparent)}
.chip.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--panel))}
.chip.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.chip.locked{cursor:default}
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
@media (max-width:720px){.groups{grid-template-columns:1fr}}
.zone{
  border:2px dashed var(--line);border-radius:12px;background:var(--panel);min-height:220px;
  display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit
}
.zone.target{border-color:var(--orange);border-style:solid}
.zone.over{background:color-mix(in srgb,var(--orange) 10%,var(--panel))}
.zhead{padding:12px 14px;border-radius:10px 10px 0 0;color:var(--onaccent);font-weight:700;font-size:1.05rem}
.zhead svg{display:block;width:120px;height:26px;margin-top:6px}
.z0 .zhead{background:var(--teal)} .z1 .zhead{background:var(--navy)} .z2 .zhead{background:var(--orange);color:#1b1206}
.zbody{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.zbody .chip{width:100%}
.hint{color:var(--muted);font-size:.9rem;margin:10px 0 0}
.fb{font-weight:400;font-size:.88rem;color:var(--muted);display:block;margin-top:4px}
.chipwrap{display:flex;flex-direction:column}
button.act{font:700 1rem "Atkinson Hyperlegible",system-ui,sans-serif;border-radius:8px;padding:10px 18px;cursor:pointer;border:2px solid transparent}
.go{background:var(--orange);color:#1b1206}
.ghost{background:transparent;color:var(--ink);border-color:var(--line)!important}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.msg{margin-top:14px;padding:12px 14px;border-left:4px solid var(--teal);background:var(--bg);border-radius:0 8px 8px 0}
.msg.warn{border-left-color:var(--orange)}
.q{margin-top:16px}
.q label{display:block;font-weight:700;margin-bottom:6px}
.q .tag{display:inline-block;padding:2px 10px;border-radius:999px;color:var(--onaccent);font-size:.85rem;margin-right:6px}
.t0{background:var(--teal)} .t1{background:var(--navy)} .t2{background:var(--orange);color:#1b1206!important}
textarea{width:100%;min-height:64px;resize:vertical;font:inherit;font-size:1rem;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input.ex{width:100%;font:inherit;font-size:1rem;padding:8px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:8px}
.sum{display:grid;gap:12px;margin-top:12px}
.sum .card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
.sum .card p{margin:6px 0 0}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Which way does it travel?</h1>
  <p class="sub">Every example below sends data between two things. Sort them by which way the data can travel. You don’t need any technical words yet.</p>
  <div class="parts"><span class="pill on" id="p1">Part 1: sort</span><span class="pill" id="p2">Part 2: describe</span></div>
  <main id="app"></main>
</div>
<script>
(function(){
const GROUPS=[
  {name:'One way only',icon:'<svg viewBox="0 0 120 26" aria-hidden="true"><rect x="1" y="4" width="20" height="18" rx="3" fill="currentColor" opacity=".9"/><rect x="99" y="4" width="20" height="18" rx="3" fill="currentColor" opacity=".9"/><line x1="26" y1="13" x2="88" y2="13" stroke="currentColor" stroke-width="3"/><path d="M88 8 L96 13 L88 18Z" fill="currentColor"/></svg>'},
  {name:'Both ways, taking turns',icon:'<svg viewBox="0 0 120 26" aria-hidden="true"><rect x="1" y="4" width="20" height="18" rx="3" fill="currentColor" opacity=".9"/><rect x="99" y="4" width="20" height="18" rx="3" fill="currentColor" opacity=".9"/><line x1="26" y1="9" x2="88" y2="9" stroke="currentColor" stroke-width="3"/><path d="M88 4 L96 9 L88 14Z" fill="currentColor"/><line x1="32" y1="19" x2="94" y2="19" stroke="currentColor" stroke-width="3" stroke-dasharray="5 4" opacity=".6"/><path d="M32 14 L24 19 L32 24Z" fill="currentColor" opacity=".6"/></svg>'},
  {name:'Both ways at once',icon:'<svg viewBox="0 0 120 26" aria-hidden="true"><rect x="1" y="4" width="20" height="18" rx="3" fill="currentColor" opacity=".9"/><rect x="99" y="4" width="20" height="18" rx="3" fill="currentColor" opacity=".9"/><line x1="26" y1="9" x2="88" y2="9" stroke="currentColor" stroke-width="3"/><path d="M88 4 L96 9 L88 14Z" fill="currentColor"/><line x1="32" y1="19" x2="94" y2="19" stroke="currentColor" stroke-width="3"/><path d="M32 14 L24 19 L32 24Z" fill="currentColor"/></svg>'}
];
const ITEMS=[
  {id:'tv',em:'📺',name:'TV broadcast',g:0,why:'The transmitter sends channels out. The TV never sends anything back.',hint:'Can a TV aerial send anything back to the transmitter?'},
  {id:'walkie',em:'📻',name:'Walkie-talkie',g:1,why:'You hold the button to talk, then let go so the other person can reply.',hint:'What happens when both people press the button at once?'},
  {id:'phone',em:'📱',name:'Phone call',g:2,why:'Both people can talk and hear each other at the same moment.',hint:'Can you hear the other person while you are talking?'},
  {id:'kbd',em:'⌨️',name:'Keyboard to PC',g:0,why:'Key presses travel from the keyboard to the computer.',hint:'Which direction do key presses travel?'},
  {id:'baby',em:'👶',name:'Baby monitor',g:0,why:'Sound goes from the baby’s room to the parent. The parent unit has no microphone.',hint:'Can the parent’s voice reach the baby’s room through a basic monitor?'},
  {id:'video',em:'🎥',name:'Video call',g:2,why:'Your camera sends while you watch and listen to the other person.',hint:'Do you have to wait for the other person to stop before your video is sent?'}
];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let place={}, sel=null, checks=0, solved=false, answers=['','',''], extras=['','',''];

function part1(){
  app.innerHTML=`<div class="panel">
      <div class="tray" id="tray" aria-label="Examples to sort"></div>
      <p class="hint">Drag each example into a group, or tap an example and then tap a group. Tap a placed example to move it again.</p>
    </div>
    <div class="groups">${GROUPS.map((g,i)=>`<div class="zone z${i}" data-g="${i}" role="button" tabindex="0" aria-label="Place in ${g.name}">
        <div class="zhead">${g.name}${g.icon}</div><div class="zbody" id="z${i}"></div></div>`).join('')}</div>
    <div class="row"><button class="act go" id="check" disabled>Check my sort</button><span class="hint" id="count" style="margin:0"></span></div>
    <div id="msg"></div>`;
  ITEMS.forEach(it=>{ if(!(it.id in place)) place[it.id]=null; });
  order=order||shuffle(ITEMS.map(i=>i.id));
  render();
  document.querySelectorAll('.zone').forEach(z=>{
    const g=+z.dataset.g;
    z.addEventListener('click',e=>{ if(e.target.closest('.chip')) return; if(sel){move(sel,g);} });
    z.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&sel){e.preventDefault(); move(sel,g);} });
    z.addEventListener('dragover',e=>{e.preventDefault(); z.classList.add('over');});
    z.addEventListener('dragleave',()=>z.classList.remove('over'));
    z.addEventListener('drop',e=>{e.preventDefault(); z.classList.remove('over'); const id=e.dataTransfer.getData('text/plain'); if(id) move(id,g);});
  });
  const tray=document.getElementById('tray');
  tray.addEventListener('dragover',e=>e.preventDefault());
  tray.addEventListener('drop',e=>{e.preventDefault(); const id=e.dataTransfer.getData('text/plain'); if(id) move(id,null);});
  document.getElementById('check').onclick=check;
}
let order=null, marks={};

function chipHTML(it){
  const m=marks[it.id];
  const cls=m===true?'right':m===false?'wrong':'';
  const fb=m===true?`<span class="fb">${esc(it.why)}</span>`:m===false?`<span class="fb">Hint: ${esc(it.hint)}</span>`:'';
  const locked=m===true;
  return `<button class="chip ${cls} ${locked?'locked':''}" data-id="${it.id}" draggable="${!locked}" aria-pressed="${sel===it.id}" ${locked?'aria-disabled="true"':''}>
    <span class="chipwrap"><span><span class="em" aria-hidden="true">${it.em}</span> ${esc(it.name)}</span>${fb}</span></button>`;
}
function render(){
  const tray=document.getElementById('tray');
  tray.innerHTML=order.filter(id=>place[id]===null).map(id=>chipHTML(ITEMS.find(i=>i.id===id))).join('');
  GROUPS.forEach((_,g)=>{document.getElementById('z'+g).innerHTML=order.filter(id=>place[id]===g).map(id=>chipHTML(ITEMS.find(i=>i.id===id))).join('');});
  document.querySelectorAll('.chip').forEach(c=>{
    const id=c.dataset.id;
    if(marks[id]===true) return;
    c.onclick=e=>{e.stopPropagation(); sel=sel===id?null:id; render();};
    c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',id); sel=null;});
  });
  document.querySelectorAll('.zone').forEach(z=>z.classList.toggle('target',!!sel));
  const left=Object.values(place).filter(v=>v===null).length;
  document.getElementById('check').disabled=left>0||solved;
  document.getElementById('count').textContent=left?`${left} still to place`:'';
}
function move(id,g){
  if(marks[id]===true) return;
  place[id]=g; delete marks[id]; sel=null; render();
}
function check(){
  checks++;
  let right=0;
  ITEMS.forEach(it=>{ marks[it.id]=place[it.id]===it.g; if(marks[it.id]) right++; });
  render();
  const msg=document.getElementById('msg');
  if(right===ITEMS.length){
    solved=true; render();
    msg.innerHTML=`<div class="msg"><b>All ${ITEMS.length} correct${checks===1?' first time':''}.</b> Read the reason under each example, then move on to part 2.
      <div class="row"><button class="act go" id="toP2">Go to part 2</button></div></div>`;
    document.getElementById('toP2').onclick=part2;
  } else if(checks>=3){
    ITEMS.forEach(it=>{place[it.id]=it.g; marks[it.id]=true;});
    solved=true; render();
    msg.innerHTML=`<div class="msg warn"><b>Here is the correct sort.</b> Read the reason under each example, especially any you had in a different group.
      <div class="row"><button class="act go" id="toP2">Go to part 2</button></div></div>`;
    document.getElementById('toP2').onclick=part2;
  } else {
    msg.innerHTML=`<div class="msg warn"><b>${right} of ${ITEMS.length} correct.</b> Use the hints on the red examples, move them, then check again.${checks===2?' One more check and the answers will be shown.':''}</div>`;
  }
}

function part2(){
  document.getElementById('p1').className='pill done';
  document.getElementById('p2').className='pill on';
  window.scrollTo(0,0);
  app.innerHTML=`<div class="panel">
    <p style="margin:0">For each group, write one sentence describing what all the examples have in common. Talk about which way data travels and when.</p>
    ${GROUPS.map((g,i)=>`<div class="q">
      <label for="a${i}"><span class="tag t${i}">${g.name}</span>${ITEMS.filter(it=>it.g===i).map(it=>esc(it.name)).join(', ')}</label>
      <textarea id="a${i}" placeholder="In this group, data...">${esc(answers[i])}</textarea>
      <input class="ex" id="e${i}" placeholder="Add one more example of your own" value="${esc(extras[i])}">
    </div>`).join('')}
    <div class="row"><button class="act go" id="fin" disabled>Finish</button><span class="hint" style="margin:0">Write a sentence for all three groups to finish.</span></div>
  </div>`;
  const ok=()=>{document.getElementById('fin').disabled=![0,1,2].every(i=>document.getElementById('a'+i).value.trim().length>=10);};
  [0,1,2].forEach(i=>document.getElementById('a'+i).addEventListener('input',ok)); ok();
  document.getElementById('fin').onclick=()=>{
    [0,1,2].forEach(i=>{answers[i]=document.getElementById('a'+i).value.trim(); extras[i]=document.getElementById('e'+i).value.trim();});
    finish();
  };
}

function finish(){
  document.getElementById('p2').className='pill done';
  window.scrollTo(0,0);
  app.innerHTML=`<div class="panel">
    <h2 style="margin:0;font-size:1.3rem">Keep these descriptions</h2>
    <p style="margin:6px 0 0;color:var(--muted)">Each group has a technical name. You’ll find out what they are later in the lesson, and you can check how close your descriptions were.</p>
    <div class="sum">${GROUPS.map((g,i)=>`<div class="card"><span class="q"><span class="tag t${i}" style="color:var(--onaccent)">${g.name}</span></span>
      <p>${esc(answers[i])}</p>${extras[i]?`<p style="color:var(--muted)">Your example: ${esc(extras[i])}</p>`:''}</div>`).join('')}</div>
    <div class="row">
      <button class="act go" id="copy">Copy my descriptions</button>
      <button class="act ghost" id="edit">Edit</button>
      <span class="hint" id="copied" style="margin:0" aria-live="polite"></span>
    </div>
  </div>`;
  document.getElementById('edit').onclick=part2;
  document.getElementById('copy').onclick=async()=>{
    const t=GROUPS.map((g,i)=>`${g.name}: ${answers[i]}${extras[i]?' (e.g. '+extras[i]+')':''}`).join('\n');
    const out=document.getElementById('copied');
    try{await navigator.clipboard.writeText(t); out.textContent='Copied.';}
    catch(e){out.textContent='Copy is blocked here. Select the text and copy it instead.';}
  };
}

part1();
})();
</script>
</body>
</html>

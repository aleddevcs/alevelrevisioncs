<title>Pick the Right Storage</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --ink: #16202B;
    --slate: #2B3A4A;
    --copper: #D9822B;
    --copper-lt: #F6E3CF;
    --copper-ink: #7A4512;
    --paper: #FFFFFF;
    --mist: #EEF2F5;
    --mist-2: #E3E9EE;
    --text: #1F2933;
    --muted: #5C6B7A;
    --line: #C9D3DC;
    --green: #2F7A4E;
    --green-lt: #DDEFE3;
    --red: #B3412F;
    --red-lt: #F4DCD7;
    --blue: #2F6DB5;
    --blue-lt: #DCE8F7;

    --bg: var(--mist);
    --surface: var(--paper);
    --surface-2: var(--mist);
    --ink-on-surface: var(--ink);
    --text-on-surface: var(--text);
    --muted-on-surface: var(--muted);
    --line-on-surface: var(--line);

    --dev-bg: var(--paper);
    --dev-line: var(--line);
    --dev-fg: var(--ink);
    --dev-sub: var(--muted);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E151D;
      --surface: #182330;
      --surface-2: #1F2C3A;
      --ink-on-surface: #F3F6F8;
      --text-on-surface: #DDE4EA;
      --muted-on-surface: #93A2B0;
      --line-on-surface: #33455A;
      --copper-lt: #4A3620;
      --copper-ink: #F0B274;
      --green-lt: #1E3A2A;
      --red-lt: #402420;
      --blue-lt: #1D3149;

      --dev-bg: #1F2C3A;
      --dev-line: #33455A;
      --dev-fg: #F3F6F8;
      --dev-sub: #93A2B0;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0E151D;
    --surface: #182330;
    --surface-2: #1F2C3A;
    --ink-on-surface: #F3F6F8;
    --text-on-surface: #DDE4EA;
    --muted-on-surface: #93A2B0;
    --line-on-surface: #33455A;
    --copper-lt: #4A3620;
    --copper-ink: #F0B274;
    --green-lt: #1E3A2A;
    --red-lt: #402420;
    --blue-lt: #1D3149;

    --dev-bg: #1F2C3A;
    --dev-line: #33455A;
    --dev-fg: #F3F6F8;
    --dev-sub: #93A2B0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-on-surface);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    padding: clamp(16px, 3vw, 40px);
    padding-block: clamp(20px, 4vw, 48px);
  }

  .wrap { max-width: 980px; margin: 0 auto; }

  header.page {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }

  .eyebrow {
    font-family: "IBM Plex Mono", "Courier New", monospace;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--copper-ink);
    background: var(--copper-lt);
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }

  h1 {
    font-size: clamp(24px, 3.4vw, 32px);
    margin: 0 0 6px;
    text-wrap: balance;
    color: var(--ink-on-surface);
  }

  .sub { color: var(--muted-on-surface); font-size: 14.5px; max-width: 58ch; line-height: 1.5; margin: 0; }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    padding-top: 4px;
  }

  .dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    background: var(--surface-2);
    color: var(--muted-on-surface);
    border: 1.5px solid var(--line-on-surface);
    transition: background .25s, color .25s, border-color .25s;
  }
  .dot.done { background: var(--green); border-color: var(--green); color: #fff; }
  .dot.active { background: var(--copper); border-color: var(--copper); color: #fff; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line-on-surface);
    border-radius: 14px;
    padding: clamp(18px, 3vw, 28px);
    margin-bottom: 18px;
  }

  .scenario-tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted-on-surface);
    margin-bottom: 6px;
  }

  .scenario-title {
    font-size: 19px;
    font-weight: 700;
    color: var(--ink-on-surface);
    margin: 0 0 10px;
  }

  .situation {
    background: var(--surface-2);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 15px;
    line-height: 1.55;
    color: var(--text-on-surface);
    font-style: italic;
    border-left: 3px solid var(--copper);
  }

  .step-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-on-surface);
    margin: 22px 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-label .step-no {
    background: var(--ink-on-surface);
    color: var(--surface);
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .step-hint { font-size: 13px; color: var(--muted-on-surface); margin: 0 0 14px; }

  .options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
  }

  .opt {
    text-align: left;
    background: var(--dev-bg);
    border: 1.5px solid var(--dev-line);
    border-radius: 10px;
    padding: 13px 14px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--dev-fg);
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .opt:hover:not(:disabled) { border-color: var(--copper); }
  .opt:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
  .opt:active:not(:disabled) { transform: translateY(1px); }
  .opt:disabled { cursor: default; }

  .opt.picked { border-color: var(--copper); box-shadow: 0 0 0 1px var(--copper) inset; }
  .opt.correct { border-color: var(--green); background: var(--green-lt); box-shadow: 0 0 0 1px var(--green) inset; }
  .opt.wrong { border-color: var(--red); background: var(--red-lt); box-shadow: 0 0 0 1px var(--red) inset; }
  .opt.dim { opacity: 0.55; }

  .opt .opt-sub { display: block; font-weight: 400; font-size: 12.5px; color: var(--dev-sub); margin-top: 3px; }

  .controls { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

  button.primary {
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: var(--copper);
    color: #2B1400;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary:hover:not(:disabled) { filter: brightness(1.06); }

  button.ghost {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1.5px solid var(--line-on-surface);
    background: transparent;
    color: var(--text-on-surface);
    cursor: pointer;
  }
  button.ghost:hover { border-color: var(--copper); }

  .feedback {
    margin-top: 14px;
    padding: 13px 16px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
  }
  .feedback.good { background: var(--green-lt); color: var(--text-on-surface); border-left: 3px solid var(--green); }
  .feedback.bad { background: var(--red-lt); color: var(--text-on-surface); border-left: 3px solid var(--red); }
  .feedback strong { color: var(--ink-on-surface); }

  .part-b {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px dashed var(--line-on-surface);
  }

  .status-line {
    font-size: 12.5px;
    color: var(--muted-on-surface);
    margin-top: 14px;
    font-family: "IBM Plex Mono", monospace;
  }

  /* Summary screen */
  .summary-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin: 18px 0 22px;
  }
  .tile {
    background: var(--surface-2);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .tile .num { font-family: "IBM Plex Mono", monospace; font-size: 28px; font-weight: 700; color: var(--copper-ink); }
  .tile .lbl { font-size: 12.5px; color: var(--muted-on-surface); margin-top: 2px; }

  .review-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line-on-surface);
    font-size: 14px;
  }
  .review-row:last-child { border-bottom: none; }
  .review-badge {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    color: #fff;
  }
  .review-badge.first { background: var(--green); }
  .review-badge.retry { background: var(--copper); }
  .review-name { font-weight: 600; color: var(--ink-on-surface); }
  .review-device { color: var(--muted-on-surface); font-size: 13px; }

  footer.page {
    margin-top: 26px;
    font-size: 12.5px;
    color: var(--muted-on-surface);
    text-align: center;
  }

  @media (max-width: 520px) {
    .options { grid-template-columns: 1fr; }
  }
</style>

<div class="wrap">
  <header class="page">
    <div>
      <div class="eyebrow">AS Unit 1 · Topic 1 · 1.5.1</div>
      <h1>Pick the Right Storage</h1>
      <p class="sub">Six real-world scenarios. Choose the best-fit secondary storage device, then justify it against the characteristic that actually decides the answer.</p>
    </div>
    <div class="progress-wrap" id="progressWrap" aria-hidden="true"></div>
  </header>

  <main id="app"></main>

  <footer class="page">AS Computer Science · Unit 1 · Topic 1 Hardware &amp; Communication · Lesson 03</footer>
</div>

<script>
(function () {
  "use strict";

  var DEVICES = ["HDD", "SSD", "Optical disc", "Magnetic tape", "Flash / USB drive", "Cloud storage"];

  var CHAR_OPTIONS = ["Speed of access", "Cost per unit", "Portability", "Capacity", "Accessibility (anywhere access)"];

  var SCENARIOS = [
    {
      title: "Ten Years, Untouched",
      situation: "A large accountancy firm must keep 10 years of financial records for compliance. The records are almost never opened once filed, but losing them would be a legal disaster — and the archive keeps growing every year.",
      deviceOptions: [
        { label: "Magnetic tape", sub: "Serial access, very cheap per byte", correct: true,
          explain: "Correct. Tape costs very little per byte, which matters when you're storing a huge and growing archive that's rarely opened — the slow serial access barely matters if you almost never read it back." },
        { label: "SSD", sub: "No moving parts, very fast access",
          explain: "SSD is very fast to access, but that speed is wasted on data you'll almost never touch — and it costs far more per byte than this archive needs." },
        { label: "Optical disc", sub: "Cheap, portable, limited capacity",
          explain: "Discs are cheap, but their capacity is small next to a financial archive that keeps growing every year — you'd need an unmanageable stack of them." },
        { label: "Cloud storage", sub: "Remote servers, accessible anywhere",
          explain: "A defensible real-world choice too — but it comes with an ongoing subscription cost that never stops, unlike a one-off physical archive." }
      ],
      charCorrect: 1,
      charCorrectExplain: "Cost per unit is what makes tape the standard choice for archival backups — a huge, growing, rarely-touched archive needs to be cheap to keep, not fast to read.",
      charWrongHint: "Think about what matters most when data is rarely accessed but stored in huge and growing volumes."
    },
    {
      title: "Between Two Desks",
      situation: "A student needs to move a handful of coursework files between the library computers and their laptop at home, plugging straight into whatever PC is free.",
      deviceOptions: [
        { label: "Flash / USB drive", sub: "Small, portable solid-state storage", correct: true,
          explain: "Correct. Small, cheap, and works in any USB port — exactly what carrying a few files between different computers needs." },
        { label: "Optical disc", sub: "Cheap, portable, limited capacity",
          explain: "Discs are portable too, but most modern laptops don't even have a disc drive any more — an awkward fit for 'plug into whatever PC is free'." },
        { label: "External HDD", sub: "Large capacity, low cost per byte",
          explain: "An external HDD would work, but it's bulkier than needed for a handful of coursework files — overkill for the job." },
        { label: "Cloud storage", sub: "Remote servers, accessible anywhere",
          explain: "Also a sensible real-world choice — but it depends on having an internet connection at both ends, which a USB drive doesn't." }
      ],
      charCorrect: 2,
      charCorrectExplain: "Portability is the deciding factor — small, physically easy to carry, and works without needing a network connection.",
      charWrongHint: "Focus on what matters when files need to travel with the student, from computer to computer."
    },
    {
      title: "Every Frame Counts",
      situation: "A video editor is working with huge 4K video files and needs the fastest possible read and write speeds to scrub through footage smoothly without lag.",
      deviceOptions: [
        { label: "SSD", sub: "No moving parts, very fast access", correct: true,
          explain: "Correct. No moving parts means far faster read/write speeds than a mechanical drive — exactly what smooth 4K editing needs." },
        { label: "HDD", sub: "Magnetic platters, moving read/write head",
          explain: "HDD can store the files, but its mechanical read/write head makes it noticeably slower — footage would stutter while scrubbing." },
        { label: "Magnetic tape", sub: "Serial access, very cheap per byte",
          explain: "Tape is built for cheap bulk archival, not fast random access — completely the wrong tool for active editing." },
        { label: "Cloud storage", sub: "Remote servers, accessible anywhere",
          explain: "Editing directly over a network introduces lag that depends on connection speed — the opposite of what smooth scrubbing needs." }
      ],
      charCorrect: 0,
      charCorrectExplain: "Speed of access is everything here — an editor scrubbing through footage needs the data now, not a fraction of a second later.",
      charWrongHint: "Think about what a video editor needs most while actively working with huge files."
    },
    {
      title: "From Any Screen",
      situation: "A family wants to keep thousands of holiday photos and view them from a phone, a laptop or a tablet, wherever they are — and they're happy to pay a small monthly fee for the convenience.",
      deviceOptions: [
        { label: "Cloud storage", sub: "Remote servers, accessible anywhere", correct: true,
          explain: "Correct. Stored on remote servers and reachable from any internet-connected device — exactly what 'from any screen, anywhere' needs, and the subscription fee matches the scenario." },
        { label: "External HDD", sub: "Large capacity, low cost per byte",
          explain: "An external HDD stores the photos fine, but it only works when physically plugged into a device — not from any screen, anywhere." },
        { label: "Flash / USB drive", sub: "Small, portable solid-state storage",
          explain: "Same problem as an external HDD — it has to be physically carried and plugged in, not accessed from anywhere." },
        { label: "Optical disc", sub: "Cheap, portable, limited capacity",
          explain: "Discs are for fixed physical distribution, not for viewing casually from a phone or tablet on the move." }
      ],
      charCorrect: 4,
      charCorrectExplain: "The deciding factor is accessibility — the whole point of cloud storage is reaching your data from any connected device, without carrying anything.",
      charWrongHint: "Think about what makes it possible to view the same photos from three different kinds of device, wherever the family happens to be."
    },
    {
      title: "The Everyday Drive",
      situation: "A small business wants an affordable way to store 4TB of everyday working files on a desktop computer. It never needs to leave the office, and speed isn't critical — just enough room for everything.",
      deviceOptions: [
        { label: "HDD", sub: "Magnetic platters, moving read/write head", correct: true,
          explain: "Correct. HDD gives large capacity at a low cost per byte — ideal for everyday bulk storage that doesn't need to be fast or to travel anywhere." },
        { label: "SSD", sub: "No moving parts, very fast access",
          explain: "SSD could hold 4TB, but at a noticeably higher cost per byte for speed and capacity the business doesn't really need." },
        { label: "Flash / USB drive", sub: "Small, portable solid-state storage",
          explain: "Flash drives are built for small, portable transfers, not for holding 4TB of a business's everyday working files." },
        { label: "Cloud storage", sub: "Remote servers, accessible anywhere",
          explain: "Cloud could work, but for a fixed desktop that never leaves the office, it adds an ongoing cost and a dependency on internet speed for no real benefit." }
      ],
      charCorrect: 3,
      charCorrectExplain: "Capacity is the deciding factor — 4TB of everyday files needs plenty of affordable room, not speed or portability.",
      charWrongHint: "Think about what matters most for a large, growing volume of everyday files that never has to leave the building."
    },
    {
      title: "Off the Grid",
      situation: "A school library wants to distribute the same set of training videos to computers in a room with no internet access — cheaply, and without needing any technical setup.",
      deviceOptions: [
        { label: "Optical disc", sub: "Cheap, portable, limited capacity", correct: true,
          explain: "Correct. Cheap to produce in bulk, works in any disc drive with no network needed, and perfect for distributing a fixed, unchanging set of videos." },
        { label: "Cloud storage", sub: "Remote servers, accessible anywhere",
          explain: "Cloud storage depends entirely on an internet connection — exactly what this room doesn't have." },
        { label: "Magnetic tape", sub: "Serial access, very cheap per byte",
          explain: "Tape is built for large-scale archival backup, not for handing out copies of a training video to a room full of computers." },
        { label: "SSD", sub: "No moving parts, very fast access",
          explain: "An SSD could work, but it's an expensive way to distribute a fixed set of videos when a cheap, disposable disc does the same job for a fraction of the cost." }
      ],
      charCorrect: 1,
      charCorrectExplain: "Cost per unit wins here — discs are cheap to mass-produce, which matters when you're distributing the same fixed content to many machines with no network involved.",
      charWrongHint: "Think about what makes it cheap and simple to hand out the same content to a room full of offline computers."
    }
  ];

  var state = {
    idx: 0,
    phase: "device", // device | char | scenarioDone
    devicePicked: null,
    deviceLocked: false,
    deviceFirstTry: true,
    deviceAttempted: false,
    charPicked: null,
    charLocked: false,
    charFirstTry: true,
    charAttempted: false,
    results: [] // {deviceFirstTry, charFirstTry, deviceLabel}
  };

  var app = document.getElementById("app");
  var progressWrap = document.getElementById("progressWrap");

  function renderProgress() {
    progressWrap.innerHTML = "";
    SCENARIOS.forEach(function (s, i) {
      var d = document.createElement("div");
      d.className = "dot" + (i < state.results.length ? " done" : i === state.idx && state.idx < SCENARIOS.length ? " active" : "");
      d.textContent = i + 1;
      progressWrap.appendChild(d);
    });
  }

  function shuffledIndices(n) {
    var arr = [];
    for (var i = 0; i < n; i++) arr.push(i);
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function resetScenarioState() {
    var sc = SCENARIOS[state.idx];
    state.phase = "device";
    state.devicePicked = null;
    state.deviceLocked = false;
    state.deviceFirstTry = true;
    state.deviceAttempted = false;
    state.charPicked = null;
    state.charLocked = false;
    state.charFirstTry = true;
    state.charAttempted = false;
    // Reshuffle option order every time a scenario is (re)entered, so the correct
    // answer doesn't always land in the same position.
    state.deviceOrder = shuffledIndices(sc.deviceOptions.length);
    state.charOrder = shuffledIndices(CHAR_OPTIONS.length);
  }

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function renderScenario() {
    var sc = SCENARIOS[state.idx];
    app.innerHTML = "";

    var card = el("div", "card");

    card.appendChild(el("div", "scenario-tag", "Scenario " + (state.idx + 1) + " of " + SCENARIOS.length));
    card.appendChild(el("h2", "scenario-title", sc.title));
    card.appendChild(el("div", "situation", sc.situation));

    // Part A: device
    var stepA = el("div", "step-label");
    stepA.innerHTML = '<span class="step-no">1</span> Choose the storage device';
    card.appendChild(stepA);
    card.appendChild(el("p", "step-hint", "Pick the device that best fits this situation."));

    var optsA = el("div", "options");
    state.deviceOrder.forEach(function (i) {
      var opt = sc.deviceOptions[i];
      var b = el("button", "opt");
      b.type = "button";
      b.innerHTML = opt.label + '<span class="opt-sub">' + opt.sub + "</span>";
      b.disabled = state.deviceLocked;
      if (state.devicePicked === i && !state.deviceLocked) b.classList.add("picked");
      if (state.deviceLocked) {
        if (opt.correct) b.classList.add("correct");
        else if (state.devicePicked === i) b.classList.add("wrong");
        else b.classList.add("dim");
      }
      b.addEventListener("click", function () {
        if (state.deviceLocked) return;
        state.devicePicked = i;
        renderScenario();
      });
      optsA.appendChild(b);
    });
    card.appendChild(optsA);

    var controlsA = el("div", "controls");
    if (!state.deviceLocked) {
      var checkA = el("button", "primary", "Check answer");
      checkA.disabled = state.devicePicked === null;
      checkA.addEventListener("click", function () {
        var opt = sc.deviceOptions[state.devicePicked];
        state.deviceLocked = true;
        if (!opt.correct) {
          state.deviceFirstTry = false;
        }
        state.deviceAttempted = true;
        renderScenario();
      });
      controlsA.appendChild(checkA);
      card.appendChild(controlsA);
    } else {
      var opt = sc.deviceOptions[state.devicePicked];
      var fb = el("div", "feedback " + (opt.correct ? "good" : "bad"), opt.explain);
      card.appendChild(fb);

      if (!opt.correct) {
        var retryWrap = el("div", "controls");
        var retryBtn = el("button", "ghost", "Try again");
        retryBtn.addEventListener("click", function () {
          state.deviceLocked = false;
          state.devicePicked = null;
          renderScenario();
        });
        retryWrap.appendChild(retryBtn);
        card.appendChild(retryWrap);
      } else {
        // Part B: characteristic — only once device is correct
        var partB = el("div", "part-b");
        var stepB = el("div", "step-label");
        stepB.innerHTML = '<span class="step-no">2</span> Justify it';
        partB.appendChild(stepB);
        partB.appendChild(el("p", "step-hint", "Which characteristic actually decided the answer?"));

        var optsB = el("div", "options");
        state.charOrder.forEach(function (i) {
          var label = CHAR_OPTIONS[i];
          var b = el("button", "opt", label);
          b.type = "button";
          b.disabled = state.charLocked;
          if (state.charPicked === i && !state.charLocked) b.classList.add("picked");
          if (state.charLocked) {
            if (i === sc.charCorrect) b.classList.add("correct");
            else if (state.charPicked === i) b.classList.add("wrong");
            else b.classList.add("dim");
          }
          b.addEventListener("click", function () {
            if (state.charLocked) return;
            state.charPicked = i;
            renderScenario();
          });
          optsB.appendChild(b);
        });
        partB.appendChild(optsB);

        var controlsB = el("div", "controls");
        if (!state.charLocked) {
          var checkB = el("button", "primary", "Check answer");
          checkB.disabled = state.charPicked === null;
          checkB.addEventListener("click", function () {
            state.charLocked = true;
            if (state.charPicked !== sc.charCorrect) state.charFirstTry = false;
            state.charAttempted = true;
            renderScenario();
          });
          controlsB.appendChild(checkB);
          partB.appendChild(controlsB);
        } else {
          var correct = state.charPicked === sc.charCorrect;
          var fbB = el("div", "feedback " + (correct ? "good" : "bad"),
            correct ? sc.charCorrectExplain : sc.charWrongHint);
          partB.appendChild(fbB);

          if (!correct) {
            var retryWrapB = el("div", "controls");
            var retryBtnB = el("button", "ghost", "Try again");
            retryBtnB.addEventListener("click", function () {
              state.charLocked = false;
              state.charPicked = null;
              renderScenario();
            });
            retryWrapB.appendChild(retryBtnB);
            partB.appendChild(retryWrapB);
          } else {
            var nextWrap = el("div", "controls");
            var nextLabel = state.idx === SCENARIOS.length - 1 ? "See summary" : "Next scenario";
            var nextBtn = el("button", "primary", nextLabel);
            nextBtn.addEventListener("click", function () {
              state.results.push({
                deviceFirstTry: state.deviceFirstTry,
                charFirstTry: state.charFirstTry,
                deviceLabel: sc.deviceOptions[state.devicePicked].label,
                title: sc.title
              });
              state.idx++;
              if (state.idx >= SCENARIOS.length) {
                renderSummary();
              } else {
                resetScenarioState();
                renderScenario();
              }
            });
            nextWrap.appendChild(nextBtn);
            partB.appendChild(nextWrap);
          }
        }
        card.appendChild(partB);
      }
    }

    app.appendChild(card);
    var status = el("div", "status-line",
      "Scenario " + (state.idx + 1) + " of " + SCENARIOS.length + " · " +
      (state.phaseLabel || (state.deviceLocked && sc.deviceOptions[state.devicePicked] && sc.deviceOptions[state.devicePicked].correct ? "Part 2 of 2 — justify it" : "Part 1 of 2 — choose the device")));
    app.appendChild(status);

    renderProgress();
  }

  function renderSummary() {
    app.innerHTML = "";
    progressWrap.innerHTML = "";
    renderProgress();

    var firstTryCount = state.results.filter(function (r) { return r.deviceFirstTry && r.charFirstTry; }).length;

    var card = el("div", "card");
    card.appendChild(el("div", "scenario-tag", "Complete"));
    card.appendChild(el("h2", "scenario-title", "All six scenarios done"));

    var tiles = el("div", "summary-tiles");
    var t1 = el("div", "tile");
    t1.innerHTML = '<div class="num">' + firstTryCount + ' / ' + SCENARIOS.length + '</div><div class="lbl">solved first try</div>';
    var t2 = el("div", "tile");
    t2.innerHTML = '<div class="num">' + SCENARIOS.length + ' / ' + SCENARIOS.length + '</div><div class="lbl">scenarios completed</div>';
    tiles.appendChild(t1);
    tiles.appendChild(t2);
    card.appendChild(tiles);

    card.appendChild(el("div", "step-label", "Your run, scenario by scenario"));
    var list = el("div");
    state.results.forEach(function (r, i) {
      var row = el("div", "review-row");
      var badgeClass = (r.deviceFirstTry && r.charFirstTry) ? "first" : "retry";
      var badgeText = (r.deviceFirstTry && r.charFirstTry) ? "✓" : "↺";
      row.innerHTML =
        '<span class="review-badge ' + badgeClass + '">' + badgeText + '</span>' +
        '<span><span class="review-name">' + (i + 1) + '. ' + r.title + '</span><br>' +
        '<span class="review-device">' + r.deviceLabel + (r.deviceFirstTry && r.charFirstTry ? "" : " — needed a retry") + '</span></span>';
      list.appendChild(row);
    });
    card.appendChild(list);

    var controls = el("div", "controls");
    var restart = el("button", "primary", "Restart");
    restart.addEventListener("click", function () {
      state = {
        idx: 0, phase: "device", devicePicked: null, deviceLocked: false, deviceFirstTry: true, deviceAttempted: false,
        charPicked: null, charLocked: false, charFirstTry: true, charAttempted: false, results: [],
        deviceOrder: [], charOrder: []
      };
      resetScenarioState();
      renderScenario();
    });
    controls.appendChild(restart);
    card.appendChild(controls);

    app.appendChild(card);
  }

  resetScenarioState();
  renderScenario();
})();
</script>
